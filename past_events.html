                        <div class="past-event-date-header">April 27, 2026</div>

                        <div class="past-talk-box" data-title="Artemis Mission" data-speaker="Barbora Hudáčková, MUNI"
                            data-abstract-en="With the recent success of the Artemis II mission, the next era of human space exploration is officially underway. This presentation explores the goals and timeline of NASA’s Artemis program, detailing our shift from simply visiting the Moon to establishing a sustained human presence. We will break down the cutting-edge hardware driving these missions, contrasting NASA's Space Launch System (SLS) and Orion spacecraft with the innovative commercial landers developed by SpaceX and Blue Origin. Along with highlighting key moments and new imagery from the Artemis II crewed flyby, we will look ahead to the upcoming surface missions and the development of lunar infrastructure."
                            data-abstract-cz="S nedávným úspěchem mise Artemis II oficiálně odstartovala nová éra pilotovaného průzkumu vesmíru. Tato prezentace zkoumá cíle a harmonogram programu Artemis od NASA a detailně přibližuje náš posun od pouhých návštěv Měsíce k vybudování trvalé lidské přítomnosti. Podrobně rozebereme špičkové technologie, které tyto mise umožňují, a porovnáme nosnou raketu Space Launch System (SLS) a kosmickou loď Orion z dílny NASA s inovativními komerčními přistávacími moduly od společností SpaceX a Blue Origin. Kromě připomenutí klíčových okamžiků a představení nových snímků z pilotovaného obletu mise Artemis II se podíváme také do budoucnosti na nadcházející povrchové mise a budování lunární infrastruktury."
                            data-slides="assets/Slides/Artemis Mission 2026-04-27.pptx">
                            <div class="past-talk-title">Artemis Mission</div>
                            <div class="past-talk-speaker">Barbora Hudáčková, MUNI</div>
                        </div>

                        <div class="past-talk-box" data-title="Nanomateriály: malé věci, velké změny"
                            data-speaker="Eliška Birgusová, MENDELU"
                            data-abstract-en="What if materials were thousands of times smaller than the width of a human hair — yet capable of transforming how we grow food or protect the environment? Nanomaterials open the door to an invisible world with enormous potential to shape our future. At this tiny scale, materials begin to behave in surprising ways — becoming more reactive, more sensitive, and able to detect what remains hidden to us. In this talk, we will explore the fascinating world of nanomaterials and discover why they are considered one of the most promising tools of modern science. We will look at their potential in sustainable agriculture, food safety, and environmental monitoring. And it won’t stay theoretical — we will also share real examples from research at Mendel University, where nanomaterials are used to “listen” to plants through sensors and better understand the world around them."
                            data-abstract-cz="Co kdyby materiály byly tisíckrát menší než tloušťka lidského vlasu a přesto dokázaly změnit způsob, jak pěstujeme potraviny nebo chráníme životní prostředí? Nanomateriály představují svět, který běžně nevidíme, ale který má obrovský potenciál ovlivnit naši budoucnost. Právě na této miniaturní škále se totiž materiály začínají chovat úplně jinak — reagují rychleji, jsou citlivější a dokážou „vidět“ věci, které nám zůstávají skryté. V této přednášce se společně podíváme do neviditelného světa nanomateriálů a ukážeme si, proč dnes patří mezi největší naděje moderní vědy. Zaměříme se na jejich možné využití v udržitelném zemědělství, bezpečnosti potravin i ochraně životního prostředí. A nezůstane jen u teorie — představíme si i konkrétní příklady z výzkumu Mendelovy univerzity, kde nanomateriály pomáhají například „naslouchat“ rostlinám pomocí senzorů nebo sledovat, co se děje v jejich okolí."
                            data-slides="#">
                            <div class="past-talk-title">Nanomateriály: malé věci, velké změny</div>
                            <div class="past-talk-speaker">Eliška Birgusová, MENDELU</div>
                        </div>
                    </div>

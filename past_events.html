<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis Mundi - Past Events</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <!-- === Background Canvas for Dynamic Star Animation === -->
    <canvas id="starsCanvas"></canvas>

    <!-- === Main Site Navigation === -->
    <nav class="main-nav">
        <a href="index.html">Upcoming Events</a>
        <a href="past_events.html" class="active">Past Events</a>
        <a href="team.html">Meet the Team!</a>
        <a href="gallery.html">Gallery</a>
    </nav>

    <!-- === Central Poster Architecture === -->
    <div class="poster-container">
        <!-- === Main Arch Frame (Content Container) === -->
        <div class="arch-frame open-bottom">
            <div class="top-star">
                <svg class="top-star-svg" viewBox="0 0 100 100" width="60" height="60" fill="none" stroke="none">
                    <path d="M50 0 Q50 45 100 50 Q50 55 50 100 Q50 55 0 50 Q50 45 50 0" fill="currentColor" />
                    <path d="M50 15 Q50 45 85 50 Q50 55 50 85 Q50 55 15 50 Q50 45 50 15" fill="currentColor"
                        transform="rotate(45 50 50)" />
                </svg>
            </div>
            <header>
                <h1 class="title">PAST<br>EVENTS</h1>
                <div class="divider">
                    <span></span>
                    <div class="diamond"></div><span></span>
                </div>
            </header>

            <div class="content-block" style="padding-bottom: 250px;">
                <main class="talks-list" id="past-events-root" style="text-align: center; margin-top: 50px;">
                    <!-- Dynamically populated by index.js -->
                </main>
            </div>
        </div>
    </div>

    <!-- === Interactive Event Details Modal === -->
    <div id="event-modal" class="lightbox-modal">
        <div class="lightbox-close" id="modal-close">&times;</div>
        <div class="event-modal-container">
            <div class="event-modal-content">
                <h2 id="modal-title" class="modal-title"></h2>
                <p id="modal-speaker" class="modal-speaker"></p>
                <div class="modal-divider"></div>

                <div class="modal-abstract-section" id="modal-abstract-section">
                    <div class="abstract-toggle" id="modal-abstract-toggle">
                        <div class="abstract-toggle-btn active" data-lang="en">English</div>
                        <div class="abstract-toggle-btn" data-lang="cz">Čeština</div>
                    </div>
                    <div class="modal-abstract-box">
                        <div id="modal-abstract-en" class="abstract-content active"></div>
                        <div id="modal-abstract-cz" class="abstract-content"></div>
                    </div>
                </div>

                <!-- Slides Container (hidden by default) -->
                <div id="modal-slides-container" class="modal-slides-container" style="display: none;">
                    <iframe id="slides-iframe" src="" width="100%" frameborder="0" allowfullscreen></iframe>
                </div>

                <div class="modal-footer">
                    <button id="view-slides-btn" class="view-slides-btn" style="display: none;">
                        <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        View Slides
                    </button>
                    <button id="view-abstract-btn" class="view-slides-btn" style="display: none;">
                        <svg class="meta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        View Abstract
                    </button>
                    <a id="modal-slides-download" href="#" download class="download-slides-btn" style="display: none;">
                        <svg class="download-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download Slides
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- === Background Explorer Call to Action === -->
    <div style="text-align: center; margin-top: 30px; margin-bottom: 40px; position: relative; z-index: 10;">
        <div class="background-explorer-cta">
            <a href="walk-simulation.html" class="explorer-btn">
                <span>What is that in the background?</span>
                <svg class="explorer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    style="width: 18px; height: 18px; margin-left: 8px; vertical-align: middle;">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </a>
        </div>
    </div>

    <!-- === Image Lightbox Modal === -->
    <div id="lightbox" class="lightbox-modal">
        <div class="lightbox-close">&times;</div>
        <div class="lightbox-nav lightbox-prev"><span>&#10094;</span></div>
        <div class="lightbox-nav lightbox-next"><span>&#10095;</span></div>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="" class="lightbox-image">
        </div>
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <script src="index.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axis Mundi - Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <!-- === Background Canvas for Dynamic Star Animation === -->
    <canvas id="starsCanvas"></canvas>

    <!-- === Main Site Navigation === -->
    <nav class="main-nav">
        <a href="index.html">Upcoming Events</a>
        <a href="past_events.html">Past Events</a>
        <a href="team.html">Meet the Team!</a>
        <a href="gallery.html" class="active">Gallery</a>
    </nav>

    <!-- === Observatory Architecture (Gallery Container) === -->
    <div class="poster-container gallery-container">
        <div class="gallery-building">
            <!-- === Observatory Dome Header === -->
            <div class="gallery-dome">
                <!-- === Scanning Telescope SVG Animation === -->
                <svg class="telescope-svg" viewBox="0 0 100 100" stroke-linejoin="round" fill="none">
                    <g class="scanning-telescope" style="transform-origin: 50px 85px;">
                        <!-- Layer 1: Opaque fills (establish solid background behind telescope) -->
                        <circle cx="50" cy="85" r="6" fill="var(--bg-color)" stroke="none" />
                        <path d="M 44 80 L 42 55 L 39 35 L 61 35 L 58 55 L 56 80 Z" fill="var(--bg-color)"
                            stroke="none" />
                        <path d="M 39 35 L 33 20 L 30 12 L 70 12 L 67 20 L 61 35 Z" fill="var(--bg-color)"
                            stroke="none" />

                        <!-- Layer 2: Darker detail lines (behind outlines) -->
                        <line x1="39" y1="35" x2="61" y2="35" stroke-width="1.5" stroke="var(--gold-dark)" />
                        <line x1="41" y1="50" x2="59" y2="50" stroke-width="1" stroke="var(--gold-dark)" />
                        <line x1="43" y1="65" x2="57" y2="65" stroke-width="1" stroke="var(--gold-dark)" />
                        <line x1="42" y1="48" x2="36" y2="38" stroke-width="1.5" stroke="var(--gold-dark)" />
                        <circle cx="35" cy="36" r="2.5" stroke="var(--gold-dark)" stroke-width="1.5" fill="none" />

                        <!-- Layer 3: Light structural outlines (drawn last = on top) -->
                        <circle cx="50" cy="85" r="6" fill="none" stroke="var(--gold-dark)" stroke-width="2" />
                        <path d="M 44 80 L 42 55 L 39 35 L 61 35 L 58 55 L 56 80 Z" fill="none"
                            stroke="var(--gold-light)" stroke-width="1.5" />
                        <path d="M 39 35 L 33 20 L 30 12 L 70 12 L 67 20 L 61 35" fill="none" stroke="var(--gold-light)"
                            stroke-width="1.5" />
                        <line x1="30" y1="12" x2="70" y2="12" stroke-width="2.5" stroke="var(--gold-dark)" />
                    </g>
                </svg>
                <div class="top-star" style="margin-bottom: 2px;">
                    <svg class="top-star-svg" viewBox="0 0 100 100" width="40" height="40" fill="none" stroke="none">
                        <path d="M50 0 Q50 45 100 50 Q50 55 50 100 Q50 55 0 50 Q50 45 50 0" fill="currentColor" />
                        <path d="M50 15 Q50 45 85 50 Q50 55 50 85 Q50 55 15 50 Q50 45 50 15" fill="currentColor"
                            transform="rotate(45 50 50)" />
                    </svg>
                </div>
                <header style="margin-top: 0; margin-bottom: 0;">
                    <h1 class="title">GALLERY</h1>
                    <div class="divider">
                        <span></span>
                        <div class="diamond"></div><span></span>
                    </div>
                </header>
            </div>

            <!-- === Gallery Image Grid Body (Injected by JS) === -->
            <div class="gallery-body" id="gallery-root">
                <!-- Gallery items will be injected here by index.js -->
            </div>
            <!-- Removed gallery-foundation completely -->
        </div>
    </div>

    <!-- === Background Explorer Call to Action === -->
    <div style="text-align: center; margin-top: 30px; margin-bottom: 40px; position: relative; z-index: 10;">
        <div class="background-explorer-cta">
            <a href="fractal-simulation.html" class="explorer-btn">
                <span>What is that in the background?</span>
                <svg class="explorer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    style="width: 18px; height: 18px; margin-left: 8px; vertical-align: middle;">
                    <polyline points="9 18 15 12 9 6" />
                </svg>
            </a>
        </div>
    </div>

    <!-- === Image Lightbox Modal === -->
    <div id="lightbox" class="lightbox-modal">
        <div class="lightbox-close">&times;</div>
        <div class="lightbox-nav lightbox-prev"><span>&#10094;</span></div>
        <div class="lightbox-nav lightbox-next"><span>&#10095;</span></div>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="" class="lightbox-image">
        </div>
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <script src="index.js"></script>
</body>

</html>
